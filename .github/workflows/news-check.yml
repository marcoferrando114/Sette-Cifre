name: news-check
on: { push: { branches: [claude/project-thread-kymne3] } }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=$(TZ=America/Santo_Domingo date +%Y%m%d)
          curl -s "https://site.api.espn.com/apis/site/v2/sports/tennis/atp/scoreboard?dates=$D" | python3 -c "
          import sys,json
          j=json.load(sys.stdin)
          for e in j.get('events',[]):
            for g in e.get('groupings',[]):
              if 'singles' in g['grouping']['slug']:
                for c in g['competitions']:
                  if c['status']['type']['state']!='post': print(json.dumps(c)[:1500]); 
          "
