name: news-check
on: { push: { branches: [claude/project-thread-kymne3] } }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp tools/pato-ai-worker.js /tmp/w.mjs
          echo 'export { games };' >> /tmp/w.mjs
          cat > /tmp/run.mjs <<'EOF'
          globalThis.caches = { default: { match: async () => null, put: async () => {} } };
          const m = await import("/tmp/w.mjs");
          try { const g = await m.games(); for (const x of g) console.log("G", x.league, "|", x.name, "|", x.score, "|", JSON.stringify(x.odds), "|", x.note); console.log("n", g.length); } catch (e) { console.log("ERR", e.stack); }
          EOF
          node /tmp/run.mjs 2>&1 | head -40
