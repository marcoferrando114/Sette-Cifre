name: news-check
on: { push: { branches: [claude/project-thread-kymne3] } }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H "Origin: https://marcoferrando114.github.io" "https://pato-ai.marcoferrando.workers.dev/edition?dbg=1" | python3 -c "
          import sys,json
          j=json.load(sys.stdin); print('v',j.get('v'),'fin',j.get('fin'),'stale',j.get('stale'),'at',j.get('at'))
          for x in (j.get('games') or []): print('GAME',x.get('league'),'|',x.get('name'),'|',x.get('t'),'|',x.get('odds'),'|',x.get('win'))
          "
